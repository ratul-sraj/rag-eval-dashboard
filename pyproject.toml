[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "Evaluation & monitoring layer for LLM apps: trace schema, metrics, LLM-as-judge, regression gate, dashboard and API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ratul S Raj" }]
keywords = ["llm", "evaluation", "rag", "text-to-sql", "observability", "langfuse"]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
judge = ["openai>=1.30"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "streamlit>=1.36",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
evalgate = "evalkit.gate:main"
evalkit = "evalkit.__main__:main"

[tool.setuptools]
packages = ["evalkit", "api", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
